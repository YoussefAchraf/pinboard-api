version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      prisma:
        patterns: ["prisma", "@prisma/*"]
      lint:
        patterns: ["eslint", "eslint-*", "@eslint/*", "typescript-eslint", "globals"]
      types:
        patterns: ["@types/*"]
      test:
        patterns: ["jest", "ts-jest", "supertest"]
      security:
        patterns: ["helmet", "cors", "cookie-parser", "express-rate-limit", "rate-limit-redis", "jsonwebtoken", "bcrypt", "xss"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
